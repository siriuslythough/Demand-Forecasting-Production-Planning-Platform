[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-demfor-planopti"
version = "0.1.0"
description = "Demand forecasting and supply chain optimization engine"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
    "lightgbm",
    "statsmodels",
    "joblib",
    "pyomo",
    "highspy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]